name: Test, build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Run tests with simulated Defender
        env:
          DEFENDERPILOT_GUI_TEST: '1'
        run: python -m unittest discover -s tests -v
      - name: Build standalone EXE
        shell: pwsh
        run: ./build.ps1
      - name: Verify packaged resources without changing Defender
        shell: pwsh
        run: |
          python -c "from PyInstaller.archive.readers import CArchiveReader; a=CArchiveReader('dist/DefenderPilot.exe'); assert 'defenderpilot/defender.ps1' in {k.replace(chr(92), '/') for k in a.toc}"
          Get-FileHash dist/DefenderPilot.exe -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + '  DefenderPilot.exe' } | Set-Content dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: DefenderPilot-Windows-x64
          path: |
            dist/DefenderPilot.exe
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from defenderpilot import __version__; print(__version__)"
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'v' + $version }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release already exists. Increase __version__ for a new release.'
            exit 0
          }
          gh release create $tag dist/DefenderPilot.exe dist/SHA256SUMS.txt --target '${{ github.sha }}' --title "DefenderPilot $version" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось опубликовать Release.' }
